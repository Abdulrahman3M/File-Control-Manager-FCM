name: Windows FCM startup checks
on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
  workflow_dispatch:

jobs:
  powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell TUI module tests
        shell: powershell
        run: ./tests/Test-TuiModules.ps1
      - name: Native PowerShell operation tests
        shell: powershell
        run: ./tests/Test-Operations.ps1
      - name: Launcher smoke tests
        shell: powershell
        run: ./tests/Test-FcmStartup.ps1

  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell TUI module tests
        shell: pwsh
        run: ./tests/Test-TuiModules.ps1
      - name: Native PowerShell operation tests
        shell: pwsh
        run: ./tests/Test-Operations.ps1
      - name: Launcher smoke tests
        shell: pwsh
        run: ./tests/Test-FcmStartup.ps1

